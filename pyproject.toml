[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenguard"
version = "0.1.0"
description = "TokenGuard: a multi-timescale, online-learning LLM router (Nested-Learning-inspired) with an OpenAI-compatible proxy."
authors = [{ name = "Raja Abraheem Rashid" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
